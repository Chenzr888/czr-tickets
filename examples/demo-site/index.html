<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄钟</title>
<style>
  :root { --tickets-accent: #e4572e; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; background: #fff7f3; color: #3b2a24; }
  main { text-align: center; }
  h1 { font-size: 18px; font-weight: 500; opacity: .7; }
  #time { font-size: 88px; font-variant-numeric: tabular-nums; margin: 8px 0 24px; }
  button { font: inherit; padding: 10px 22px; margin: 0 6px; border: 0; border-radius: 999px; background: #e4572e; color: #fff; cursor: pointer; }
  button.ghost { background: none; color: #e4572e; border: 1px solid #e4572e; }
</style>
</head>
<body>
<main>
  <h1>专注 25 分钟</h1>
  <div id="time">25:00</div>
  <button id="start">开始</button>
  <button id="reset" class="ghost">重置</button>
</main>
<script>
  let left = 25 * 60, timer = null;
  const show = () => (document.getElementById("time").textContent =
    `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`);
  document.getElementById("start").onclick = () => {
    if (timer) { clearInterval(timer); timer = null; return (start.textContent = "继续"); }
    timer = setInterval(() => { left--; show(); }, 1000);
    start.textContent = "暂停";
  };
  document.getElementById("reset").onclick = () => {
    left = 25 * 60;
    show();
    start.textContent = "开始";
  };
</script>
<script src="/tickets-widget.js" data-api="/api/tickets" defer></script>
</body>
</html>
